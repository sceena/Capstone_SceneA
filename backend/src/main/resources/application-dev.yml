spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: dev-secret-key-change-this-in-production-must-be-at-least-32-chars

cloud:
  aws:
    s3:
      endpoint: http://localhost:9000
      bucket: carpoolink
    credentials:
      access-key: minioadmin
      secret-key: minioadmin
    region:
      static: us-east-1