spring.application.name=backend

# H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=your-secret-key-change-this-in-production-must-be-at-least-32-chars
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=1209600000

# MinIO (S3 compatible)
cloud.aws.s3.endpoint=http://localhost:9000
cloud.aws.s3.bucket=carpoolink
cloud.aws.credentials.access-key=minioadmin
cloud.aws.credentials.secret-key=minioadmin
cloud.aws.region.static=us-east-1

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
