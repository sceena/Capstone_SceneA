name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'media-server/**'
      - 'client/**'
      - '.github/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/carpoolink-backend
  MEDIA_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/carpoolink-media-server
  CLIENT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/carpoolink-client

jobs:
  # ── 변경된 경로 감지 ──────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "변경된 파일: $CHANGED"

          # .github/ 변경 시 전체 재배포
          if echo "$CHANGED" | grep -qE "^\.github/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "client=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if echo "$CHANGED" | grep -qE "^(backend|media-server)/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE "^client/"; then
            echo "client=true" >> $GITHUB_OUTPUT
          else
            echo "client=false" >> $GITHUB_OUTPUT
          fi

  # ── 백엔드 테스트 (backend 변경 시에만) ──────────────────────
  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version=8.13
        working-directory: backend

      - name: Grant execute permission for gradlew
        run: chmod +x ./backend/gradlew

      - name: Run tests
        run: |
          cd backend
          ./gradlew test

  # ── 태그 & 릴리즈 (항상 실행, test가 성공하거나 스킵된 경우) ──
  tag-and-release:
    needs: [changes, test]
    if: always() && needs.changes.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true

  # ── 백엔드 + 미디어서버 빌드 & 푸시 (backend 변경 시에만) ────
  build-and-push:
    needs: [tag-and-release, changes]
    if: needs.changes.outputs.backend == 'true' && needs.tag-and-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version=8.13
        working-directory: backend

      - name: Grant execute permission for gradlew
        run: chmod +x ./backend/gradlew

      - name: Build JAR
        run: |
          cd backend
          ./gradlew bootJar -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.tag-and-release.outputs.new_tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Build and push media-server image
        uses: docker/build-push-action@v6
        with:
          context: ./media-server
          push: true
          tags: |
            ${{ env.MEDIA_IMAGE_NAME }}:${{ needs.tag-and-release.outputs.new_tag }}
            ${{ env.MEDIA_IMAGE_NAME }}:latest

  # ── 프론트엔드 빌드 & 푸시 (client 변경 시에만) ──────────────
  build-and-push-client:
    needs: [tag-and-release, changes]
    if: needs.changes.outputs.client == 'true' && needs.tag-and-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_MEDIA_SERVER_URL=http://${{ secrets.EC2_HOST }}:4000
          tags: |
            ${{ env.CLIENT_IMAGE_NAME }}:${{ needs.tag-and-release.outputs.new_tag }}
            ${{ env.CLIENT_IMAGE_NAME }}:latest

  # ── EC2 배포 ──────────────────────────────────────────────────
  deploy:
    needs: [build-and-push, build-and-push-client, changes]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push-client.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN,IMAGE_NAME,MEDIA_IMAGE_NAME,CLIENT_IMAGE_NAME
          script: |
            set -e
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── backend ──────────────────────────────────────────
            if [ "${{ needs.build-and-push.result }}" = "success" ]; then
              docker pull ${{ env.IMAGE_NAME }}:latest
              docker stop carpoolink-backend || true
              docker rm carpoolink-backend || true
              docker run -d \
                --name carpoolink-backend \
                --restart unless-stopped \
                -p 8080:8080 \
                -e "DB_URL=${{ secrets.DB_URL }}" \
                -e "DB_USERNAME=${{ secrets.DB_USERNAME }}" \
                -e "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
                -e "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
                -e "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" \
                -e "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" \
                -e "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" \
                -e "AWS_REGION=${{ secrets.AWS_REGION }}" \
                -e "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
                -e "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
                -e "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" \
                -e "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" \
                -e "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" \
                -e "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" \
                -e "OAUTH_REDIRECT_URI=${{ secrets.OAUTH_REDIRECT_URI }}" \
                ${{ env.IMAGE_NAME }}:latest

              docker pull ${{ env.MEDIA_IMAGE_NAME }}:latest
              docker stop carpoolink-media-server || true
              docker rm carpoolink-media-server || true
              docker run -d \
                --name carpoolink-media-server \
                --network host \
                --restart unless-stopped \
                -e "PORT=4000" \
                -e "SPRING_BOOT_URL=http://localhost:8080" \
                -e "ANNOUNCED_IP=${{ secrets.ANNOUNCED_IP }}" \
                -e "RTC_MIN_PORT=10000" \
                -e "RTC_MAX_PORT=10100" \
                ${{ env.MEDIA_IMAGE_NAME }}:latest
            fi

            # ── client ───────────────────────────────────────────
            if [ "${{ needs.build-and-push-client.result }}" = "success" ]; then
              docker pull ${{ env.CLIENT_IMAGE_NAME }}:latest
              docker stop carpoolink-client || true
              docker rm carpoolink-client || true
              docker run -d \
                --name carpoolink-client \
                --network host \
                --restart unless-stopped \
                ${{ env.CLIENT_IMAGE_NAME }}:latest
            fi

            docker image prune -f
