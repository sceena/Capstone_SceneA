services:
  backend:
    build: ./backend
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL:-https://crib-mutilator-uncle.ngrok-free.dev}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-http://54.116.176.242:8080}
    restart: unless-stopped

  ai-server:
    build: ./ai-server
    network_mode: host
    environment:
      AI_CORS_ORIGINS: ${AI_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-medium}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      STT_WORKER_COUNT: ${STT_WORKER_COUNT:-1}
    restart: unless-stopped

  media-server:
    build: ./media-server
    network_mode: host
    environment:
      PORT: 4000
      SPRING_BOOT_URL: http://localhost:8080
      ANNOUNCED_IP: ${ANNOUNCED_IP}
      RTC_MIN_PORT: 10000
      RTC_MAX_PORT: 10100
    depends_on:
      - backend
      - ai-server
    restart: unless-stopped
